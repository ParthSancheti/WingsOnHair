name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - run: npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wings-on-hair-2.6-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-traces
          path: test-results/
          if-no-files-found: ignore

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Install pinned ESP32 and NimBLE dependencies
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install 'NimBLE-Arduino@2.5.2'
      - name: Compile ESP32-C3 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir firmware-build ./firmware/WingsOnHair_Firmware
      - uses: actions/upload-artifact@v4
        with:
          name: wings-on-hair-2.6-firmware
          path: firmware-build/
          if-no-files-found: error
